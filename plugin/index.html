<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'"><title>安安素材管理器</title><link rel="stylesheet" href="style.css"></head>
<body><main><button id="insert" type="button" data-state="waiting" title="等待安安素材管理器发送素材 · 安屿动画" aria-label="等待素材。等待安安素材管理器发送素材 · 安屿动画" aria-live="polite" disabled>等待素材</button><button id="add-current" type="button" data-state="ready" title="保存当前 AN 文档并一键加入素材库 · 安屿动画" aria-label="加入素材库。保存当前 AN 文档并一键加入素材库 · 安屿动画" aria-live="polite">加入素材库</button></main><section id="add-confirm" class="confirmation" role="dialog" aria-modal="true" aria-labelledby="confirm-heading" aria-describedby="confirm-description" hidden><div class="confirmation-brand">✦ 安安素材管理器</div><h1 id="confirm-heading">把这份灵感，收进素材库</h1><p id="confirm-description">将保存当前 AN 文档并加入素材库。<br>库内文档会更新原素材。<br>取消不会保存，也不会加入。</p><div class="confirmation-actions"><button id="confirm-cancel" type="button">取消</button><button id="confirm-save" type="button">保存并加入</button></div></section><script src="panel.js"></script></body></html>
