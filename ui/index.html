<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' anshelf: data: blob:; media-src 'self' anshelf: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'">
  <title>安安素材管理器</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="category-select.css">
  <link rel="stylesheet" href="brand.css">
  <link rel="stylesheet" href="skin.css">
  <link rel="stylesheet" href="themes.css">
  <link rel="stylesheet" href="appearance.css">
  <link rel="stylesheet" href="modern.css">
  <link rel="stylesheet" href="practical.css">
  <link rel="stylesheet" href="import-workspace.css">
  <link rel="stylesheet" href="preview-details.css">
  <link rel="stylesheet" href="browse.css">
  <link rel="stylesheet" href="scene-groups.css">
  <link rel="stylesheet" href="onboarding.css">
  <link rel="stylesheet" href="root-navigation.css">
  <link rel="stylesheet" href="author-feedback.css">
</head>
<body>
  <header class="titlebar" aria-label="窗口标题栏">
    <div class="titlebar-brand"><span data-icon="layers"></span><strong class="titlebar-wordmark"><span class="anan-wordmark" aria-hidden="true"></span><span>安安素材管理器</span></strong><span class="titlebar-note">安屿动画 · 你的创作素材，一眼找到</span></div>
    <div class="titlebar-controls"><button data-action="window-minimize" aria-label="最小化" title="最小化" data-icon="minimize"></button><button data-action="window-maximize" aria-label="最大化或还原" title="最大化或还原" data-icon="maximize"></button><button class="window-close" data-action="window-close" aria-label="关闭窗口" title="关闭窗口" data-icon="close"></button></div>
  </header>
  <div class="app-shell">
    <aside class="sidebar" aria-label="素材导航">
      <a class="brand" href="#" data-action="home" aria-label="安安素材管理器，全部素材">
        <span class="brand-symbol" data-icon="layers"></span>
        <span class="brand-lockup"><span class="anan-wordmark" aria-hidden="true"></span><small>安安素材管理器</small></span>
      </a>
      <div class="workspace-label">我的素材空间 <span>LOCAL</span></div>
      <div class="root-navigation-shell">
        <button class="root-navigation-scroll" data-root-navigation-scroll="previous" aria-label="向前查看顶部分类" title="向前查看顶部分类" hidden>‹</button>
        <nav id="navigation" aria-label="素材筛选"></nav>
        <button class="root-navigation-scroll" data-root-navigation-scroll="next" aria-label="向后查看顶部分类" title="向后查看顶部分类" hidden>›</button>
        <button class="root-navigation-open" data-root-navigation-open title="打开分类、设置常驻与排列顺序">更多分类</button>
      </div>
      <button class="top-category-trigger" data-top-categories aria-expanded="false" aria-controls="category-panel"><span data-icon="folder"></span>分类<span data-icon="down"></span></button>
      <div id="category-panel" class="category-panel" role="region" aria-label="分类浏览">
      <div class="section-label"><span>我的分类</span><button class="icon-button" data-action="create-category" title="新建分类" aria-label="新建分类" data-icon="plus"></button></div>
      <label class="category-search"><span data-icon="search"></span><input id="category-filter" type="search" placeholder="快速找分类" aria-label="筛选分类" autocomplete="off"></label>
      <nav id="categories" class="category-list" aria-label="自定义分类"></nav>
      </div>
      <div class="sidebar-bottom">
        <div id="top-more-panel" role="region" aria-label="更多设置">
        <button class="skin-settings-trigger" data-action="skin-settings" title="图片、GIF 或视频底图"><span data-icon="spark"></span>更换皮肤</button>
        <div class="theme-switch" role="group" aria-label="界面色调"><button data-action="theme" data-theme="dark" aria-label="暗色调" aria-pressed="true"><span data-icon="moon"></span>暗色</button><button data-action="theme" data-theme="warm" aria-label="暖色调" aria-pressed="false"><span data-icon="sun"></span>暖色</button></div>
        <button class="bridge-card" data-action="bridge-help">
          <span class="bridge-mark">An</span><span><strong>连接 Adobe Animate</strong><small id="sidebar-bridge">打开 AN 面板即可接收</small></span><span data-icon="chevron"></span>
        </button>
        <div class="local-note"><span class="status-dot"></span> 本地素材 · 安心收藏 <span data-icon="info"></span></div>
        </div>
      </div>
      <div id="navigation-actions" class="navigation-actions" aria-label="素材操作与工具"></div>
    </aside>
    <main class="main">
      <div class="library-toolbar">
      <header class="topbar">
        <div class="breadcrumb">素材空间 <span data-icon="chevron"></span> <strong id="breadcrumb">全部素材</strong></div>
        <div class="import-entries"><button class="button primary import-main" data-action="import"><span data-icon="plus"></span>导入素材</button></div>
        <div class="window-actions"><details id="workspace-tools" class="workspace-tools"><summary aria-label="工具与设置"><span data-icon="grid"></span><span>工具</span><span data-icon="down"></span></summary><div class="workspace-tools-panel" role="group" aria-label="工具与设置"><button class="onboarding-trigger" data-action="onboarding"><span data-icon="info"></span><span>新手引导</span></button><button id="app-update" class="app-update" data-action="check-updates" data-state="idle"><span data-icon="refresh"></span><span id="app-update-label">检查更新</span><span class="update-dot" aria-hidden="true"></span></button><button class="appearance-settings-trigger" data-action="appearance-settings"><span data-icon="grid"></span><span>外观与布局</span></button><button class="workspace-skin-trigger" data-action="skin-settings"><span data-icon="spark"></span><span>更换皮肤</span></button><button id="connection" class="connection-pill" data-action="bridge-help"><span class="status-dot"></span><span>AN 未连接</span></button><button id="compact" data-action="compact"><span data-icon="compact"></span><span>迷你置顶模式</span></button><button class="feedback-trigger" data-action="author-feedback"><span data-icon="info"></span><span>反馈与交流群</span></button><button class="author-trigger" data-action="author-message"><span data-icon="heart"></span><span>投喂作者</span></button></div></details></div>
      </header>
      <section class="tools" aria-label="筛选和排序">
        <div class="browse">
          <button id="browse" class="sort-trigger browse-trigger" data-action="toggle-browse" aria-label="浏览方式与每页数量" aria-haspopup="menu" aria-expanded="false">浏览： <span id="browse-label">固定分页</span><span data-icon="down"></span></button>
          <div id="browse-menu" class="sort-menu browse-menu" role="menu" aria-label="浏览方式与每页数量" hidden>
            <strong>浏览方式</strong>
            <button role="menuitemradio" data-action="browse-mode" data-browse-mode="fit" aria-checked="true">固定分页（适配窗口）<span data-icon="check"></span></button>
            <button role="menuitemradio" data-action="browse-mode" data-browse-mode="scroll" aria-checked="false">滚动浏览<span data-icon="check"></span></button>
            <strong>每页数量</strong>
            <button role="menuitemradio" data-action="browse-size" data-browse-size="auto" aria-checked="true">自动适屏<span data-icon="check"></span></button>
            <button role="menuitemradio" data-action="browse-size" data-browse-size="24" aria-checked="false">24 个<span data-icon="check"></span></button>
            <button role="menuitemradio" data-action="browse-size" data-browse-size="48" aria-checked="false">48 个<span data-icon="check"></span></button>
            <button role="menuitemradio" data-action="browse-size" data-browse-size="60" aria-checked="false">60 个<span data-icon="check"></span></button>
            <label class="browse-custom-size">自定义<input id="browse-size-input" type="number" min="1" max="1000" step="1" value="60" aria-label="自定义每页数量"></label>
            <button class="browse-apply-size" data-action="browse-custom-size">应用</button>
          </div>
        </div>
        <label class="search"><span data-icon="search"></span><input id="search" type="search" placeholder="搜索名称或标签…" aria-label="搜索素材名称或标签" autocomplete="off"><kbd>/</kbd></label>
        <span id="asset-count" class="asset-count">0 个素材</span>
        <div class="density"><button id="density" class="sort-trigger density-trigger" data-action="toggle-density" aria-label="网格密度" aria-haspopup="menu" aria-expanded="false"><span data-icon="grid"></span><span id="density-label">自动</span><span data-icon="down"></span></button><div id="density-menu" class="sort-menu" role="menu" aria-label="网格密度" hidden><button role="menuitemradio" data-action="density" data-density="auto" aria-checked="true">自动<span data-icon="check"></span></button><button role="menuitemradio" data-action="density" data-density="4" aria-checked="false">每行 4 个<span data-icon="check"></span></button><button role="menuitemradio" data-action="density" data-density="5" aria-checked="false">每行 5 个<span data-icon="check"></span></button><button role="menuitemradio" data-action="density" data-density="6" aria-checked="false">每行 6 个<span data-icon="check"></span></button><button role="menuitemradio" data-action="density" data-density="7" aria-checked="false">每行 7 个<span data-icon="check"></span></button><button role="menuitemradio" data-action="density" data-density="8" aria-checked="false">每行 8 个<span data-icon="check"></span></button></div></div>
        <div class="filter"><button id="filter" class="sort-trigger filter-trigger" data-action="toggle-filter" aria-label="素材筛选" aria-haspopup="menu" aria-expanded="false"><span>筛选</span><span data-icon="down"></span></button><div id="filter-menu" class="sort-menu" role="menu" aria-label="素材筛选" hidden><button role="menuitemcheckbox" data-action="filter" data-filter="hide-child-categories" aria-checked="false">隐藏已归入子文件夹<span data-icon="check"></span></button></div></div>
        <div class="sort"><button id="sort" class="sort-trigger" data-action="toggle-sort" aria-label="素材排序" aria-haspopup="menu" aria-expanded="false"><span>最近导入</span><span data-icon="down"></span></button><div id="sort-menu" class="sort-menu" role="menu" aria-label="素材排序" hidden><button role="menuitemradio" data-action="sort" data-sort="newest" aria-checked="true">最近导入<span data-icon="check"></span></button><button role="menuitemradio" data-action="sort" data-sort="oldest" aria-checked="false">最早导入<span data-icon="check"></span></button><button role="menuitemradio" data-action="sort" data-sort="name" aria-checked="false">名称 A–Z<span data-icon="check"></span></button></div></div>
      </section>
      <nav id="subcategories" class="subcategory-bar" aria-label="顶层的下一级分类"></nav>
      </div>
      <div id="host-error" class="host-error" role="alert" hidden></div>
      <section class="library-heading"><div><h1 id="page-title">全部素材</h1><p id="page-description">把灵感收好，让创作轻一点。</p></div></section>
      <nav id="deepcategories" class="deepcategory-bar" aria-label="更深层分类" hidden></nav>
      <div id="queue-status" class="queue-status" role="status" hidden></div>
      <div id="bridge-status" class="bridge-status" role="status" hidden></div>
      <section id="selection-bar" class="selection-bar" aria-label="选中素材操作" hidden></section>
      <section id="asset-grid" class="asset-grid" aria-label="素材预览"></section>
      <nav id="asset-pagination" class="asset-pagination" aria-label="素材分页" hidden></nav>
      <section id="empty-state" class="empty-state" hidden></section>
      <footer class="library-footer"><span id="footer-summary">你的素材，只在这台电脑上。</span><span>Ctrl 多选 <i>·</i> Shift 连选</span></footer>
    </main>
    <aside id="inspector" class="inspector" aria-label="素材详情" hidden></aside>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
  <section id="audio-player" class="audio-player" aria-label="音频试听播放器" hidden><button class="audio-toggle icon-button" data-action="audio-toggle" aria-label="暂停试听"><span data-icon="pause"></span></button><div class="audio-current"><strong id="audio-name"></strong><span id="audio-time">0:00 / —</span></div><input id="audio-seek" type="range" min="0" max="0" step=".1" value="0" aria-label="音频播放位置"><p id="audio-error" role="alert" hidden></p><button class="icon-button" data-action="audio-stop" aria-label="停止试听" title="停止试听"><span data-icon="close"></span></button></section>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
